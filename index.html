<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<meta name="description" content="過期與訂閱提醒管家 — 追蹤訂閱扣款與物品效期，扣款前主動警示，一鍵跳轉取消頁面">
<title>效期管家 · 過期與訂閱提醒</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 頂部標題 ===== -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon">⏰</span>
      <div>
        <h1>效期管家</h1>
        <p class="tagline">訂閱不再亂扣款 · 物品不再放到過期</p>
      </div>
    </div>
    <button id="notifBtn" class="notif-btn" title="開啟推播通知" aria-label="通知設定">🔔<span id="notifDot" class="notif-dot hidden"></span></button>
  </div>
  <!-- 統計列 -->
  <div class="stats-bar">
    <div class="stat"><b id="statUrgent">0</b><span>本週到期</span></div>
    <div class="stat"><b id="statSubs">0</b><span>訂閱中</span></div>
    <div class="stat"><b id="statMonthly">$0</b><span>每月支出</span></div>
    <div class="stat"><b id="statSaved">0</b><span>已省下/年</span></div>
  </div>
</header>

<main class="container">

  <!-- ===== 篩選分頁 ===== -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-filter="all">全部</button>
    <button class="tab" data-filter="subscription">💳 訂閱</button>
    <button class="tab" data-filter="expiry">🥬 效期物品</button>
    <button class="tab" data-filter="done">✓ 已處理</button>
  </nav>

  <!-- ===== 排序控制 ===== -->
  <div class="sort-row">
    <label>排序：
      <select id="sortSelect">
        <option value="urgent">緊急度（剩餘天數）</option>
        <option value="name">名稱</option>
        <option value="price">金額（高→低）</option>
        <option value="added">新增時間</option>
      </select>
    </label>
    <span id="itemCount" class="muted"></span>
  </div>

  <!-- ===== 清單 ===== -->
  <section id="list" class="list" aria-live="polite"></section>

  <!-- 空狀態 -->
  <div id="emptyState" class="empty hidden">
    <div class="empty-icon">📭</div>
    <h2>還沒有任何項目</h2>
    <p>點下方「＋ 新增」，或直接拍照讓 AI 識別發票上的日期！</p>
  </div>
</main>

<!-- ===== 底部動作列 ===== -->
<div class="fab-bar">
  <button id="scanBtn" class="fab secondary" title="拍照識別效期">📷<span>拍照識別</span></button>
  <button id="addBtn" class="fab primary" title="手動新增">＋<span>手動新增</span></button>
</div>

<!-- ===== 新增/編輯 Modal ===== -->
<div id="modalOverlay" class="overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">新增項目</h2>
      <button class="close-btn" data-close>✕</button>
    </div>

    <form id="itemForm">
      <!-- 類型切換 -->
      <div class="seg-group" role="radiogroup" aria-label="項目類型">
        <label><input type="radio" name="type" value="subscription" checked><span>💳 訂閱服務</span></label>
        <label><input type="radio" name="type" value="expiry"><span>🥬 效期物品</span></label>
      </div>

      <label class="field">
        <span>名稱 *</span>
        <input type="text" name="name" required maxlength="40" placeholder="例如：Netflix / 鮮奶 / 維他命C">
      </label>

      <!-- 訂閱專用 -->
      <div id="subFields" class="type-fields">
        <label class="field">
          <span>下次扣款日 *</span>
          <input type="date" name="nextDate" required>
          <small class="hint">通常可在 App 內「帳戶 → 訂閱」查到</small>
        </label>
        <div class="field-row">
          <label class="field"><span>金額</span><input type="number" name="price" min="0" step="0.01" placeholder="390"></label>
          <label class="field"><span>週期</span>
            <select name="cycle">
              <option value="monthly">每月</option>
              <option value="yearly">每年</option>
              <option value="weekly">每週</option>
            </select>
          </label>
        </div>
        <label class="field"><span>取消連結（選填）</span>
          <input type="url" name="cancelUrl" placeholder="https://…">
          <small class="hint">輸入名稱時會自動提議常見服務的官方取消頁</small>
        </label>
        <div id="suggestBox" class="suggest-box hidden">
          <p class="hint">🔍 偵測到常見服務，點擊自動帶入：</p>
          <div id="suggestList" class="suggest-list"></div>
        </div>
      </div>

      <!-- 效期專用 -->
      <div id="expFields" class="type-fields hidden">
        <label class="field">
          <span>有效期限 *</span>
          <input type="date" name="expireDate" required>
        </label>
        <div class="field-row">
          <label class="field"><span>數量</span><input type="number" name="qty" min="1" step="1" value="1"></label>
          <label class="field"><span>存放位置</span>
            <select name="location">
              <option value="">未指定</option>
              <option>冰箱冷藏</option><option>冰箱冷凍</option><option>櫥櫃</option>
              <option>藥箱</option><option>浴室</option><option>其他</option>
            </select>
          </label>
        </div>
      </div>

      <div class="field-row">
        <label class="field"><span>提前提醒（天）</span><input type="number" name="warnDays" min="0" max="60" value="3"></label>
        <label class="field"><span>備註</span><input type="text" name="note" maxlength="60" placeholder="選填"></label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== 掃描 Modal ===== -->
<div id="scanOverlay" class="overlay hidden">
  <div class="modal scan-modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>📷 拍照 / 上傳識別</h2>
      <button class="close-btn" data-close>✕</button>
    </div>
    <p class="scan-tip">對準發票、標籤或包裝上的<strong>效期 / 扣款資訊</strong>拍攝，AI 將自動辨識日期與金額。</p>

    <div id="scanArea" class="scan-area">
      <img id="previewImg" class="hidden" alt="預覽">
      <canvas id="ocrCanvas" class="hidden"></canvas>
      <div class="scan-actions">
        <label class="btn primary file-label">
          📸 拍照 / 選擇圖片
          <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        </label>
      </div>
    </div>

    <div id="ocrStatus" class="ocr-status hidden">
      <div class="spinner"></div><span id="ocrStatusText">正在辨識…</span>
    </div>

    <div id="ocrResult" class="ocr-result hidden">
      <h3>辨識結果 <small class="muted">（請確認後修正）</small></h3>
      <details>
        <summary>查看原始文字</summary>
        <pre id="rawText" class="raw-text"></pre>
      </details>
      <div id="parsedFields" class="parsed-fields"></div>
      <button id="applyScan" class="btn primary wide" disabled>套用到表單 ✓</button>
    </div>
  </div>
</div>

<!-- ===== Toast ===== -->
<div id="toast" class="toast hidden"></div>

<script src="js/services.js"></script>
<script src="js/ocr.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
